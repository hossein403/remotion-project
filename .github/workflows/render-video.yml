name: Render video
on:
  push:
  workflow_dispatch:
jobs:
  render:
    name: Render video
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx remotion render MrChera out/video.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: mr-chera-video
          path: out/video.mp4
